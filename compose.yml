services:
  web:
    image: ghcr.io/highl0ad/mafia_game:latest
    container_name: mafia_web
    restart: always
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - TZ=Asia/Baku
    volumes:
      - mafia_data:/app/instance
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:18000:8000"

volumes:
  mafia_data:
