[tool.poetry]
name = "mafia"
version = "0.2.0"
description = "Mafia Game Web App"
authors = ["VoiceOfDarkness <abil.samedov2016@yandex.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
flask = "^3.0.3"
flask-sqlalchemy = "^3.1.1"
flask-socketio = "^5.3.6"
gunicorn = "^22.0.0"
gevent = "^24.2.1"
gevent-websocket = "^0.10.1"
jinja2 = "^3.1.4"
python-dotenv = "^1.0.1"
icecream = "^2.1.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
