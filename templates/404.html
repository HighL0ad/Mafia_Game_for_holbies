{% extends 'base.html' %}

{% block title %}404 | Error{% endblock %}

{% block main %}
<div class="glass-card" style="text-align: center;">
    <div class="brand-icon" style="background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: var(--color-danger);">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 class="brand-title" style="font-size: 1.8rem;">404 <span data-i18n="not_found_title">XƏTA</span></h1>
    <p style="color: var(--text-secondary); margin-bottom: 24px;" data-i18n="not_found_msg">
        {{ message if message else 'Otaq və ya səhifə tapılmadı.' }}
    </p>
    <a href="{{ url_for('home_bp.index') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> <span data-i18n="btn_to_home">Ana səhifəyə</span>
    </a>
</div>
{% endblock %}
