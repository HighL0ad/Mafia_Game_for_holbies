<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d0f14">
    <meta name="description" content="Mafiya Onlayn / Mafia Game / Мафия онлайн">
    <title>{% block title %}Mafia Game{% endblock %}</title>

    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=1.5.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/role.css') }}?v=1.5.0">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="{{ url_for('static', filename='js/translations.js') }}?v=1.5.0"></script>
    <script src="{{ url_for('static', filename='js/audio.js') }}?v=1.5.0"></script>
</head>

<body>
    <div class="app-background">
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>
    </div>

    <!-- Fixed Top Right Navigation Bar with Audio & Language Switcher -->
    <header class="top-nav-bar">
        <div class="nav-controls-group">
            <button type="button" class="audio-btn" id="sound-toggle-btn" onclick="sounds.toggle()" title="Səs">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <div class="lang-selector">
                <button type="button" class="lang-btn" data-lang="az" onclick="setLanguage('az')">AZ</button>
                <button type="button" class="lang-btn" data-lang="ru" onclick="setLanguage('ru')">RU</button>
                <button type="button" class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
            </div>
        </div>
    </header>

    <div class="page-container">
        <main class="main-wrapper">
            {% block main %}{% endblock %}
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Global Toast Notification Helper
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast-item toast-${type}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info')}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
    </script>
</body>

</html>
